name: CI/CD Pipeline (GitOps)

on:
  push:
    branches: [ "pipeline" ]

# Set permissions to allow the Action to commit and open PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-update-manifest:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        # We don't strictly need fetch-depth: 0 if we use the PR action, but it's safe to leave

      # Step 2: Authenticate with DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build the Docker image and tag it with the Git commit SHA
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Website
          push: true
          tags: syacode/django-app:${{ github.sha }}

      # Step 4: Update the Kubernetes manifest locally
      - name: Update Kubernetes Manifest
        run: |
          # Use 'sed' to find the old image and replace it with the new one
          # Ensure the file path matches where your deployment.yaml is stored
          sed -i "s|image: syacode/django-app:.*|image: syacode/django-app:${{ github.sha }}|g" k8s-manifests/django.yaml
          
      # Step 5: Create a Pull Request to bypass the direct push restriction
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update image tag to ${{ github.sha }} [skip ci]"
          branch: "bot/update-image-${{ github.sha }}"
          title: "Update Django app image to ${{ github.sha }}"
          body: "Automated PR from GitHub Actions to update the Kubernetes manifest with the latest built image tag."
          base: pipeline # Change to 'main' if you want the PR to merge into main instead
