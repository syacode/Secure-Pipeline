name: CI/CD Pipeline (GitOps)

on:
  push:
    branches: [ "pipeline" ]

# Set permissions to allow the Action to commit back to the repo
permissions:
  contents: write

jobs:
  build-and-update-manifest:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetches the full history so we can push commits later
          fetch-depth: 0 

      # Step 2: Authenticate with DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build the Docker image and tag it with the Git commit SHA
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # REPLACE 'your-docker-username/your-app' with your actual details
          tags: syacode/django-app:${{ github.sha }}

      # Step 4: Update the Kubernetes manifest and commit the change
      - name: Update Kubernetes Manifest
        run: |
          # Configure Git 
          git config --global user.name 'GitHub Actions Automaton'
          git config --global user.email 'actions@github.com'
          
          # Use 'sed' to find the old image and replace it with the new one
          # Ensure the file path matches where your deployment.yaml is stored
          sed -i "s|image: syacode/django-app:.*|image: syacode/django-app:${{ github.sha }}|g" k8s-manifests/django.yaml
          
          # Commit and push the changes back to the main branch
          git add k8s-manifests/django.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push origin main
